name: Daily Instagram post

on:
  # Monday to Saturday, posts at 5:00 PM Dubai time. No post on Sunday.
  # GitHub often starts scheduled jobs late, so it is asked three times
  # (3:15, 4:15 and 4:45 PM Dubai). The first run to start prepares the post and waits
  # until exactly 5:00 PM; later runs see it's already posted and stop.
  # To PAUSE the bot, put a # at the start of the next 4 lines.
  schedule:
    - cron: "15 11 * * 1-6"
    - cron: "15 12 * * 1-6"
    - cron: "45 12 * * 1-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: make the image but don't post"
        type: boolean
        default: true
      check_key:
        description: "Only check the Instagram key works (reads account name, posts nothing)"
        type: boolean
        default: false
      preview_all:
        description: "Test only: make images for ALL projects in the sheet (saved in the previews folder)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-post

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Make and post today's image
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          CHECK_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.check_key || 'false' }}
          PREVIEW_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_all || 'false' }}
        run: python -u bot.py

      - name: Save image preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-preview
          path: posts/*.jpg
          if-no-files-found: ignore
